name: STEVORA OS Dev4 - Raspberry Pi 4 ARM64 image (BUILD-ONLY)

on:
  push:
    branches:
      - feature/stevora-os-native-dev4-rpi4-image-20261125
    paths:
      - 'distribution/native-image/**'
      - '.github/workflows/stevora-os-native-rpi4-build.yml'
  workflow_call:
  workflow_dispatch:
    inputs:
      lab_version:
        description: Pi 4 OTA lab version, leave empty for a standard image
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: stevora-dev4-rpi4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: ARM64 source and regression contracts (not a boot test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: distribution/native-image/gateway/go.mod
          cache: false
      - name: Validate native image and Pi 4 contracts
        run: |
          python3 -m unittest discover -s distribution/native-image/tests -p 'test_*.py' -v
          python3 -m py_compile distribution/native-image/scripts/patch-data-partition.py
          bash -n distribution/native-image/scripts/prepare-haos.sh
          test -s custom_components/stevora/manifest.json
          test -s custom_components/stevora_os/frontend/icons/stevora-192.png
          for f in distribution/native-image/web/*.js; do node --check "$f"; done
          (cd distribution/native-image/gateway && go test ./...)
          echo "Source validation PASS; no Pi hardware boot has been tested."

  lab-certificate:
    if: github.event_name == 'workflow_dispatch' && inputs.lab_version != '' && github.ref == 'refs/heads/codex/rpi4-auto-ota-test'
    runs-on: ubuntu-24.04
    environment: stevora-os-release
    steps:
      - name: Validate Pi 4 lab version
        env:
          LAB_VERSION: ${{ inputs.lab_version }}
        run: '[[ "$LAB_VERSION" =~ ^1\.1\.(0|[1-9][0-9]{0,5})$ ]]'
      - name: Export only the public publisher certificate
        env:
          PUBLISHER_CERT: ${{ secrets.STEVORA_RAUC_CERT_PEM }}
        run: |
          openssl x509 -checkend 0 -noout <<< "${PUBLISHER_CERT:?missing publisher certificate}"
          openssl x509 <<< "$PUBLISHER_CERT" > publisher.pem
      - uses: actions/upload-artifact@v4
        with:
          name: lab-publisher-certificate
          path: publisher.pem
          if-no-files-found: error

  build-rpi4:
    if: always() && !cancelled() && needs.source-validation.result == 'success' && (needs.lab-certificate.result == 'success' || !inputs.lab_version)
    name: Build actual rpi4_64 ARM64 .img.xz (hardware boot not verified)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    needs: [source-validation, lab-certificate]
    env:
      UPSTREAM_HAOS_SHA: 495bedb8d70a92ad189efb64829ece34b165d3bd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: distribution/native-image/gateway/go.mod
          cache: false

      - name: Inspect resources and free unused runner SDKs
        run: |
          df -h /
          free -h
          docker --version
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Fetch exact pinned upstream Home Assistant OS and Buildroot
        run: |
          git clone --filter=blob:none --depth 1 --branch dev \
            https://github.com/home-assistant/operating-system.git haos
          git -C haos fetch --no-tags --depth 1 origin "$UPSTREAM_HAOS_SHA"
          git -C haos checkout --detach "$UPSTREAM_HAOS_SHA"
          git -C haos submodule update --init --depth 1
          test "$(git -C haos rev-parse HEAD)" = "$UPSTREAM_HAOS_SHA"
          test -f haos/buildroot/Makefile
          grep -qx 'BR2_aarch64=y' haos/buildroot-external/configs/rpi4_64_defconfig
          grep -qx 'BR2_PACKAGE_HASSIO_MACHINE="raspberrypi4-64"' \
            haos/buildroot-external/configs/rpi4_64_defconfig

      - name: Cross-compile static STEVORA gateway for Linux ARM64
        run: |
          cd distribution/native-image/gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
            -o stevora-native-gateway .
          test -x stevora-native-gateway
          file stevora-native-gateway
          file stevora-native-gateway | grep -qi 'ARM aarch64'

      - name: Overlay STEVORA components onto the pinned Raspberry Pi 4 target
        env:
          STEVORA_OTA_LAB_VERSION: ${{ inputs.lab_version }}
        run: |
          bash distribution/native-image/scripts/prepare-haos.sh haos rpi4_64
          grep -qx 'BR2_PACKAGE_LIBOPENSSL_BIN=y' haos/buildroot-external/configs/rpi4_64_defconfig
          grep -qx 'CONFIG_HTTPD=y' haos/buildroot-external/busybox.config
          grep -q 'native_bootstrap: true' haos/buildroot-external/package/hassio/create-data-partition.sh
          test -s haos/buildroot-external/stevora-custom-components/stevora/manifest.json
          file haos/buildroot-external/rootfs-overlay/usr/bin/stevora-native-gateway | grep -qi 'ARM aarch64'
          grep -qx 'enable stevora-native-web.service' \
            haos/buildroot-external/rootfs-overlay/usr/lib/systemd/system-preset/70-haos.preset
          git -C haos diff --stat

      - uses: actions/download-artifact@v4
        if: startsWith(github.ref, 'refs/tags/stevora-os-v')
        with:
          name: release-publisher-certificate
          path: publisher-certificate

      - name: Embed the public OTA publisher certificate
        if: startsWith(github.ref, 'refs/tags/stevora-os-v')
        run: |
          rootfs=haos/buildroot-external/rootfs-overlay
          install -Dm0644 publisher-certificate/publisher.pem "$rootfs/etc/stevora/publisher.pem"

      - uses: actions/download-artifact@v4
        if: inputs.lab_version != ''
        with:
          name: lab-publisher-certificate
          path: lab-publisher
      - name: Embed publisher trust for the Pi 4 OTA channel
        if: inputs.lab_version != ''
        env:
          LAB_VERSION: ${{ inputs.lab_version }}
        run: |
          install -Dm0644 lab-publisher/publisher.pem \
            haos/buildroot-external/rootfs-overlay/etc/stevora/publisher.pem
          cmp lab-publisher/publisher.pem haos/buildroot-external/rootfs-overlay/etc/stevora/publisher.pem
          grep -Fx "rpi4_64 stevora-os-lab-v$LAB_VERSION" \
            haos/buildroot-external/rootfs-overlay/usr/share/stevora-os/release-feed

      - name: Build Raspberry Pi 4 image via upstream HAOS Buildroot container
        working-directory: haos
        env:
          MAKEFLAGS: -j2
        run: |
          scripts/enter.sh make O=output_rpi4_64 rpi4_64
          find output_rpi4_64/images -maxdepth 1 -type f -printf '%f %s bytes\n'
          test -n "$(find output_rpi4_64/images -maxdepth 1 -name 'haos_rpi4-64-*.img.xz' -print -quit)"

      - name: Validate compressed image integrity (not a hardware boot)
        id: image
        run: |
          IMAGE="$(find haos/output_rpi4_64/images -maxdepth 1 -name 'haos_rpi4-64-*.img.xz' -print -quit)"
          test -n "$IMAGE"
          test -s "$IMAGE"
          xz -t "$IMAGE"
          xz -l "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Package reproducible build-only Raspberry Pi 4 image
        env:
          LAB_VERSION: ${{ inputs.lab_version || 'not configured' }}
        run: |
          mkdir -p release
          cp "${{ steps.image.outputs.image }}" release/stevora-native-dev4-rpi4-64.img.xz
          cat > release/BUILD-IDENTITY.txt <<EOF
          STEVORA OS Native Integrated Dev4 — Raspberry Pi 4 64-bit
          STEVORA source commit: $GITHUB_SHA
          Pi 4 OTA lab version: $LAB_VERSION
          Pinned Home Assistant OS source: $UPSTREAM_HAOS_SHA
          Target: rpi4_64 / linux arm64 / raspberrypi4-64
          Status: BUILD-ONLY; physical Raspberry Pi 4 boot NOT VERIFIED
          Security: test image only, HTTP 80 for trusted local networks.
          OTA: STEVORA signed updates NOT VERIFIED; backup restore disabled.
          Never overwrite a working Dunav installation or production media.
          EOF
          (cd release && sha256sum stevora-native-dev4-rpi4-64.img.xz > SHA256SUMS.txt)
          ls -lh release

      - name: Collect release input from this build
        if: startsWith(github.ref, 'refs/tags/stevora-os-v') || inputs.lab_version != ''
        run: |
          shopt -s nullglob
          bundles=(haos/output_rpi4_64/images/*.raucb)
          test "${#bundles[@]}" -eq 1
          cp "${bundles[0]}" publisher-input.raucb

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/stevora-os-v') || inputs.lab_version != ''
        with:
          name: publisher-input-rpi4_64
          path: publisher-input.raucb
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: STEVORA-OS-Dev4-RPi4-ARM64-BUILD-ONLY
          path: release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sign-lab-ota:
    name: Sign Pi 4 laboratory OTA bundle
    if: github.event_name == 'workflow_dispatch' && inputs.lab_version != '' && inputs.lab_version != '1.1.0' && github.ref == 'refs/heads/codex/rpi4-auto-ota-test'
    needs: [build-rpi4]
    runs-on: ubuntu-24.04
    environment: stevora-os-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: publisher-input-rpi4_64
          path: input
      - run: sudo apt-get update -qq && sudo apt-get install -y rauc
      - name: Sign and verify the laboratory bundle
        env:
          PUBLISHER_CERT: ${{ secrets.STEVORA_RAUC_CERT_PEM }}
          PUBLISHER_KEY: ${{ secrets.STEVORA_RAUC_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          signing=$(mktemp -d)
          trap 'rm -rf "$signing"' EXIT
          mkdir -p lab
          openssl x509 -checkend 0 -noout <<< "${PUBLISHER_CERT:?missing public certificate}"
          openssl x509 <<< "$PUBLISHER_CERT" > lab/publisher.pem
          printf '%s\n' "${PUBLISHER_KEY:?missing signing key}" > "$signing/key.pem"
          unset PUBLISHER_KEY
          rauc --no-verify --cert=lab/publisher.pem --key="$signing/key.pem" resign \
            input/publisher-input.raucb lab/stevora-os-rpi4_64.raucb
          rauc --keyring=lab/publisher.pem info lab/stevora-os-rpi4_64.raucb
          openssl x509 -in lab/publisher.pem -noout -fingerprint -sha256 > lab/PUBLISHER-SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > lab/SOURCE-COMMIT.txt
          (cd lab && sha256sum stevora-os-rpi4_64.raucb publisher.pem > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: STEVORA-RPI4-ARM64-LAB-OTA
          path: lab/
          retention-days: 7
          if-no-files-found: error
