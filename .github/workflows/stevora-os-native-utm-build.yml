name: STEVORA OS Dev4 - UTM ARM64 UEFI image

on:
  push:
    branches:
      - feature/stevora-os-native-dev4-utm-arm64
      - feature/adaptive-phase-1-2-utm
    paths:
      - 'distribution/native-image/**'
      - '.github/workflows/stevora-os-native-utm-build.yml'
  pull_request:
    branches: [feature/stevora-os-native-dev4-utm-arm64]
    paths:
      - 'distribution/native-image/**'
      - '.github/workflows/stevora-os-*.yml'
  workflow_call:
  workflow_dispatch:
    inputs:
      lab_ota:
        description: Enable the isolated automatic OTA test channel
        type: boolean
        default: false
      lab_version:
        description: Laboratory baseline or follow-up update
        type: choice
        options: ["1.0.0", "1.0.1", "1.0.2", "1.0.3"]
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: stevora-dev4-utm-${{ github.ref }}-${{ inputs.lab_version || 'normal' }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: ARM64 source and regression contracts (not a boot test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: distribution/native-image/gateway/go.mod
          cache: false
      - name: Validate native image and Dev4 contracts
        run: |
          python3 -m unittest discover -s distribution/native-image/tests -p 'test_*.py' -v
          python3 -m py_compile distribution/native-image/scripts/patch-data-partition.py
          bash -n distribution/native-image/scripts/prepare-haos.sh
          test -s custom_components/stevora/manifest.json
          test -s custom_components/stevora_os/frontend/icons/stevora-192.png
          for f in distribution/native-image/web/*.js; do node --check "$f"; done
          (cd distribution/native-image/gateway && go test ./...)
          echo "Source validation PASS; guest boot is checked separately."

      - name: Exercise Adaptive Phase 1 and 2, thermostat and visual icon editor
        run: |
          python3 -m venv "$RUNNER_TEMP/stevora-browser"
          "$RUNNER_TEMP/stevora-browser/bin/pip" install playwright==1.56.0 voluptuous
          "$RUNNER_TEMP/stevora-browser/bin/python" -m unittest discover -s tests/stevora -v
          node --test distribution/native-image/tests/adaptive_renderer.test.cjs
          "$RUNNER_TEMP/stevora-browser/bin/python" distribution/native-image/tests/browser_adaptive_renderer.py
          "$RUNNER_TEMP/stevora-browser/bin/python" distribution/native-image/tests/browser_device_controls.py
          "$RUNNER_TEMP/stevora-browser/bin/python" distribution/native-image/tests/browser_onboarding.py

      - name: Verify RAUC publisher signing with disposable test keys
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rauc squashfs-tools
          bash distribution/native-image/tests/release-signing.sh

  lab-certificate:
    if: github.event_name == 'workflow_dispatch' && inputs.lab_ota && github.ref == 'refs/heads/codex/utm-auto-ota-test'
    runs-on: ubuntu-24.04
    environment: stevora-os-release
    steps:
      - name: Export only the public publisher certificate
        env:
          PUBLISHER_CERT: ${{ secrets.STEVORA_RAUC_CERT_PEM }}
        run: |
          openssl x509 -checkend 0 -noout <<< "${PUBLISHER_CERT:?missing publisher certificate}"
          openssl x509 <<< "$PUBLISHER_CERT" > publisher.pem
      - uses: actions/upload-artifact@v4
        with:
          name: lab-publisher-certificate
          path: publisher.pem
          if-no-files-found: error

  build-utm:
    if: always() && !cancelled() && needs.source-validation.result == 'success' && (needs.lab-certificate.result == 'success' || !inputs.lab_ota) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: Build generic ARM64 UEFI QCOW2
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    needs: [source-validation, lab-certificate]
    env:
      UPSTREAM_HAOS_SHA: 495bedb8d70a92ad189efb64829ece34b165d3bd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: distribution/native-image/gateway/go.mod
          cache: false

      - name: Inspect resources and free unused runner SDKs
        run: |
          df -h /
          free -h
          docker --version
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Fetch exact pinned upstream Home Assistant OS and Buildroot
        run: |
          git clone --filter=blob:none --depth 1 --branch dev \
            https://github.com/home-assistant/operating-system.git haos
          git -C haos fetch --no-tags --depth 1 origin "$UPSTREAM_HAOS_SHA"
          git -C haos checkout --detach "$UPSTREAM_HAOS_SHA"
          git -C haos submodule update --init --depth 1
          test "$(git -C haos rev-parse HEAD)" = "$UPSTREAM_HAOS_SHA"
          test -f haos/buildroot/Makefile
          grep -qx 'BR2_aarch64=y' haos/buildroot-external/configs/generic_aarch64_defconfig
          grep -qx 'BR2_PACKAGE_HASSIO_MACHINE="qemuarm-64"' \
            haos/buildroot-external/configs/generic_aarch64_defconfig

      - name: Cross-compile static STEVORA gateway for Linux ARM64
        run: |
          cd distribution/native-image/gateway
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
            -o stevora-native-gateway .
          test -x stevora-native-gateway
          file stevora-native-gateway
          file stevora-native-gateway | grep -qi 'ARM aarch64'

      - name: Overlay STEVORA components onto the pinned ARM64 UEFI target
        env:
          STEVORA_OTA_LAB_VERSION: ${{ inputs.lab_ota && inputs.lab_version || '' }}
        run: |
          bash distribution/native-image/scripts/prepare-haos.sh haos generic_aarch64
          grep -qx 'BR2_PACKAGE_LIBOPENSSL_BIN=y' haos/buildroot-external/configs/generic_aarch64_defconfig
          grep -qx 'CONFIG_HTTPD=y' haos/buildroot-external/busybox.config
          grep -q 'native_bootstrap: true' haos/buildroot-external/package/hassio/create-data-partition.sh
          test -s haos/buildroot-external/stevora-custom-components/stevora/manifest.json
          cmp custom_components/stevora/adaptive_api.py \
            haos/buildroot-external/stevora-custom-components/stevora/adaptive_api.py
          cmp distribution/native-image/web/adaptive.js \
            haos/buildroot-external/rootfs-overlay/usr/share/stevora-os/adaptive.js
          file haos/buildroot-external/rootfs-overlay/usr/bin/stevora-native-gateway | grep -qi 'ARM aarch64'
          grep -qx 'enable stevora-native-web.service' \
            haos/buildroot-external/rootfs-overlay/usr/lib/systemd/system-preset/70-haos.preset
          git -C haos diff --stat

      - uses: actions/download-artifact@v4
        if: startsWith(github.ref, 'refs/tags/stevora-os-v')
        with:
          name: release-publisher-certificate
          path: publisher-certificate

      - name: Embed the public OTA publisher certificate
        if: startsWith(github.ref, 'refs/tags/stevora-os-v')
        run: |
          rootfs=haos/buildroot-external/rootfs-overlay
          install -Dm0644 publisher-certificate/publisher.pem "$rootfs/etc/stevora/publisher.pem"

      - uses: actions/download-artifact@v4
        if: inputs.lab_ota
        with:
          name: lab-publisher-certificate
          path: lab-publisher
      - name: Embed publisher trust for the isolated OTA channel
        if: inputs.lab_ota
        run: |
          install -Dm0644 lab-publisher/publisher.pem \
            haos/buildroot-external/rootfs-overlay/etc/stevora/publisher.pem

      - name: Build ARM64 UEFI image via upstream HAOS Buildroot container
        working-directory: haos
        env:
          MAKEFLAGS: -j2
        run: |
          scripts/enter.sh make O=output_generic_aarch64 generic_aarch64
          find output_generic_aarch64/images -maxdepth 1 -type f -printf '%f %s bytes\n'
          test -n "$(find output_generic_aarch64/images -maxdepth 1 -name 'haos_generic-aarch64-*.qcow2.xz' -print -quit)"

      - name: Verify and stage compressed disk
        run: |
          image="$(find haos/output_generic_aarch64/images -maxdepth 1 -name 'haos_generic-aarch64-*.qcow2.xz' -print -quit)"
          xz -t "$image"
          mkdir -p staging
          cp "$image" staging/stevora-native-dev4-utm-arm64.qcow2.xz

      - name: Collect release input from this build
        if: startsWith(github.ref, 'refs/tags/stevora-os-v') || (github.event_name == 'workflow_dispatch' && inputs.lab_ota)
        run: |
          shopt -s nullglob
          bundles=(haos/output_generic_aarch64/images/*.raucb)
          test "${#bundles[@]}" -eq 1
          cp "${bundles[0]}" publisher-input.raucb

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/stevora-os-v') || (github.event_name == 'workflow_dispatch' && inputs.lab_ota)
        with:
          name: publisher-input-generic_aarch64
          path: publisher-input.raucb
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: UTM-ARM64-BUILD-ONLY
          path: staging/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  boot-utm:
    name: ARM64 UEFI boot and STEVORA HTTP smoke
    runs-on: ubuntu-24.04
    needs: build-utm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: UTM-ARM64-BUILD-ONLY
          path: release/

      - name: Install AArch64 QEMU and UEFI firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64 qemu-utils

      - name: Boot actual disk with ARM64 UEFI and test the gateway
        env:
          QEMU_BOOT_ATTEMPTS: 300
        run: |
          disk=release/stevora-native-dev4-utm-arm64.qcow2
          xz -dk "$disk.xz"
          qemu-img check -f qcow2 "$disk"
          bash distribution/native-image/scripts/qemu-smoke.sh "$disk" aarch64 boot-logs
          rm "$disk"

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UTM-ARM64-QEMU-LOGS
          path: boot-logs/
          retention-days: 7

      - name: Record build identity and checksums
        run: |
          cp distribution/native-image/UTM-BG.md release/
          cat > release/BUILD-IDENTITY.txt <<META
          STEVORA OS Native Integrated Developer Preview 4
          STEVORA build commit: $GITHUB_SHA
          OTA lab version: ${{ inputs.lab_ota && inputs.lab_version || 'not configured' }}
          Raspberry Pi 4 baseline: 74456c70dc821d70822b60309b6e33a50e24e39a
          Pinned Home Assistant OS: 495bedb8d70a92ad189efb64829ece34b165d3bd
          Target: generic_aarch64 / qemuarm-64 / ARM64 UEFI
          Adaptive Phase 1 and 2 contract and Chromium tests: PASS
          QEMU ARM64 UEFI boot, gateway HTTP and adaptive.js: PASS
          UTM/HVF, Core onboarding, production integrations and signed OTA: unverified
          META
          (cd release && sha256sum *.qcow2.xz > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'feature/adaptive-phase-1-2-utm' && 'STEVORA-OS-Adaptive-Phase1-2-UTM-ARM64-QEMU-PASS' || 'STEVORA-OS-Dev4-UTM-ARM64-QEMU-PASS' }}
          path: release/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  sign-lab-ota:
    name: Sign UTM laboratory OTA bundle
    if: github.event_name == 'workflow_dispatch' && inputs.lab_ota && github.ref == 'refs/heads/codex/utm-auto-ota-test' && (inputs.lab_version == '1.0.1' || inputs.lab_version == '1.0.2' || inputs.lab_version == '1.0.3')
    needs: [boot-utm]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    environment: stevora-os-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: publisher-input-generic_aarch64
          path: input
      - run: sudo apt-get update -qq && sudo apt-get install -y rauc
      - name: Sign and verify the laboratory bundle
        env:
          PUBLISHER_CERT: ${{ secrets.STEVORA_RAUC_CERT_PEM }}
          PUBLISHER_KEY: ${{ secrets.STEVORA_RAUC_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          signing=$(mktemp -d)
          trap 'rm -rf "$signing"' EXIT
          mkdir -p lab
          openssl x509 -checkend 0 -noout <<< "${PUBLISHER_CERT:?missing public certificate}"
          openssl x509 <<< "$PUBLISHER_CERT" > lab/publisher.pem
          printf '%s\n' "${PUBLISHER_KEY:?missing signing key}" > "$signing/key.pem"
          unset PUBLISHER_KEY
          rauc --no-verify --cert=lab/publisher.pem --key="$signing/key.pem" resign \
            input/publisher-input.raucb lab/stevora-os-generic_aarch64.raucb
          rauc --keyring=lab/publisher.pem info lab/stevora-os-generic_aarch64.raucb
          openssl x509 -in lab/publisher.pem -noout -fingerprint -sha256 > lab/PUBLISHER-SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > lab/SOURCE-COMMIT.txt
          (cd lab && sha256sum stevora-os-generic_aarch64.raucb publisher.pem > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: STEVORA-UTM-ARM64-LAB-OTA
          path: lab/
          retention-days: 7
          if-no-files-found: error

      - name: Publish the boot-checked update to the isolated prerelease channel
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_VERSION: ${{ inputs.lab_version }}
        run: |
          case "$LAB_VERSION" in 1.0.1|1.0.2|1.0.3) ;; *) exit 1 ;; esac
          gh release create "stevora-os-lab-v$LAB_VERSION" lab/stevora-os-generic_aarch64.raucb lab/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "STEVORA OS UTM automated OTA lab $LAB_VERSION" \
            --notes "Laboratory UTM ARM64 update. Source: $GITHUB_SHA. Install from Update Center with administrator approval."
