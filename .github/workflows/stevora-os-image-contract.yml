name: STEVORA OS Native Distribution Contract

on:
  push:
    branches:
      - feature/stevora-os-native-image-distribution-20261120
    paths:
      - 'distribution/**'
      - '.github/workflows/stevora-os-image-contract.yml'
  pull_request:
    paths:
      - 'contracts/adaptive/**'
      - 'distribution/**'
      - '.github/workflows/stevora-os-image-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution-contract:
    name: Native image requirements (no image build yet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify target is real STEVORA image + root UI
        run: python -m unittest discover -s distribution/tests -p 'test_*.py' -v
      - uses: actions/setup-go@v5
        with:
          go-version-file: distribution/native-image/gateway/go.mod
          cache: false
      - name: Test gateway authorization and release contracts
        working-directory: distribution/native-image/gateway
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test adaptive native UI contract
        run: |
          node --check distribution/native-image/web/app.js
          node --test distribution/native-image/tests/adaptive_renderer.test.cjs
      - name: Exercise adaptive controls at mobile viewport width
        run: |
          python -m pip install playwright==1.56.0
          python distribution/native-image/tests/browser_adaptive_renderer.py
      - name: Explicitly prevent fake release artifact
        run: |
          python - <<'PY'
          import json
          with open('distribution/image-contract.json', encoding='utf-8') as f:
              spec = json.load(f)
          assert spec['status'] == 'architecture', "Releases must use a real signed-image workflow"
          assert spec['artifacts']['bootable_image'] is None, "Do not claim an unbuilt OS image"
          print("Architecture contract valid. Boot image is NOT built.")
          PY
