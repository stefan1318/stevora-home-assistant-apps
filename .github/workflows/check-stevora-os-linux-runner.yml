name: Check STEVORA OS macOS ARM64 runner

'on':
  push:
    branches: [ci/check-stevora-os-linux-runner]
    paths: [.github/workflows/check-stevora-os-linux-runner.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-runner:
    if: github.repository == 'stefan1318/stevora-home-assistant-apps' && github.event.repository.private
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - name: Verify self-hosted macOS ARM64 runner and build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          printf 'Runner: %s (%s, %s)\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
          for tool in python3 node git bash docker; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Missing required tool: $tool"
              exit 1
            fi
          done
          python3 --version
          node --version
          git --version
          bash --version | head -n 1
          docker --version
          if command -v xz >/dev/null 2>&1; then xz --version | head -n 1; else echo "::notice::xz is not installed on the macOS host; install before native image packaging if needed"; fi
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker daemon is unavailable. Start Docker Desktop or Colima on this Mac."
            exit 1
          fi
      - name: Start a disposable Linux ARM64 Docker container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 --network none docker.io/library/alpine:3.21 uname -m
      - name: Check out the Dev4 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run native image source tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s distribution/native-image/tests -p 'test_*.py' -v
          bash -n distribution/native-image/scripts/prepare-haos.sh
          for script in distribution/native-image/web/*.js; do
            node --check "$script"
          done
