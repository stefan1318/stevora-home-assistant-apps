name: Publish signed STEVORA OS releases
on:
  push:
    tags: ['stevora-os-lab-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-stevora-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify administrator approval and selected version tag
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVER: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" != stevora-os-v0.0.0
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$APPROVER/permission" --jq .permission)
          test "$permission" = admin
      - run: '[[ "$GITHUB_REF_NAME" =~ ^stevora-os-(lab-)?v(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})$ ]]'
  publisher-certificate:
    needs: version
    runs-on: ubuntu-24.04
    environment: stevora-os-release
    steps:
      - name: Export the public publisher certificate
        env:
          PUBLISHER_CERT: ${{ secrets.STEVORA_RAUC_CERT_PEM }}
        run: |
          printf '%s\n' "${PUBLISHER_CERT:?missing release certificate}" |
            openssl x509 -out publisher.pem
          openssl x509 -in publisher.pem -checkend 0 -noout
      - uses: actions/upload-artifact@v4
        with:
          name: release-publisher-certificate
          path: publisher.pem
          if-no-files-found: error
  pi:
    needs: publisher-certificate
    uses: ./.github/workflows/stevora-os-native-rpi4-build.yml
  utm:
    needs: publisher-certificate
    permissions:
      contents: write
    uses: ./.github/workflows/stevora-os-native-utm-build.yml
  ova:
    if: '!startsWith(github.ref, ''refs/tags/stevora-os-lab-v'')'
    needs: publisher-certificate
    uses: ./.github/workflows/stevora-os-native-integrated-build.yml
  publish:
    needs: [pi, utm, ova]
    if: >-
      !cancelled() && needs.pi.result == 'success' && needs.utm.result == 'success' &&
      (needs.ova.result == 'success' ||
       (startsWith(github.ref, 'refs/tags/stevora-os-lab-v') && needs.ova.result == 'skipped'))
    runs-on: ubuntu-24.04
    environment: stevora-os-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: publisher-input-*
          path: inputs
      - uses: actions/download-artifact@v4
        with:
          name: release-publisher-certificate
          path: publisher-certificate
      - run: sudo apt-get update -qq && sudo apt-get install -y rauc
      - name: Sign and verify the target bundles
        env:
          PUBLISHER_KEY: ${{ secrets.STEVORA_RAUC_KEY_PEM }}
        run: |
          export PUBLISHER_CERT="$(cat publisher-certificate/publisher.pem)"
          targets=(rpi4_64 generic_aarch64)
          if [[ "$GITHUB_REF_NAME" != stevora-os-lab-v* ]]; then targets+=(ova); fi
          bash distribution/native-image/scripts/sign-release.sh inputs signed "${targets[@]}"
      - name: Generate bundle checksums
        run: cd signed && sha256sum *.raucb > SHA256SUMS.txt
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == stevora-os-lab-v* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" signed/*.raucb signed/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}" --title "$GITHUB_REF_NAME" --generate-notes
